name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.TVREMOTE_KEYSTORE_BASE64 != '' }}
      HAS_UPLOAD_KEY: ${{ secrets.TVREMOTE_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute version
        # Monotonic build number: run 81 published v0.3.55, so subtract 26. It becomes the APK
        # versionCode and the release tag, which the in-app updater compares.
        run: echo "TVREMOTE_BUILD_NUMBER=$((GITHUB_RUN_NUMBER - 26))" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Two variants: "github" (APK on GitHub releases, self-updating) and "play" (Google Play bundle).
      - name: Build debug APK
        run: gradle --no-daemon assembleGithubDebug

      - name: Screenshot tests
        run: gradle --no-daemon testGithubDebugUnitTest
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TvRemote-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          TVREMOTE_KEYSTORE_BASE64: ${{ secrets.TVREMOTE_KEYSTORE_BASE64 }}
          TVREMOTE_KEYSTORE_PASSWORD: ${{ secrets.TVREMOTE_KEYSTORE_PASSWORD }}
          TVREMOTE_KEY_ALIAS: ${{ secrets.TVREMOTE_KEY_ALIAS }}
          TVREMOTE_KEY_PASSWORD: ${{ secrets.TVREMOTE_KEY_PASSWORD }}
        run: |
          echo "$TVREMOTE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvremote.jks"
          export TVREMOTE_KEYSTORE="$RUNNER_TEMP/tvremote.jks"
          gradle --no-daemon assembleGithubRelease
          cp app/build/outputs/apk/github/release/app-github-release.apk "TvRemote-v0.3.${TVREMOTE_BUILD_NUMBER}.apk"

      - name: Name debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: cp app/build/outputs/apk/github/debug/app-github-debug.apk "TvRemote-v0.3.${TVREMOTE_BUILD_NUMBER}-debug.apk"

      - name: Build Google Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          TVREMOTE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TVREMOTE_UPLOAD_KEYSTORE_BASE64 }}
          TVREMOTE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.TVREMOTE_UPLOAD_KEYSTORE_PASSWORD }}
          TVREMOTE_UPLOAD_KEY_ALIAS: ${{ secrets.TVREMOTE_UPLOAD_KEY_ALIAS }}
          TVREMOTE_UPLOAD_KEY_PASSWORD: ${{ secrets.TVREMOTE_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$TVREMOTE_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export TVREMOTE_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle --no-daemon bundlePlayRelease
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "TvRemote-play-v0.3.${TVREMOTE_BUILD_NUMBER}.aab"
      - name: Upload Google Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TvRemote-play-aab
          path: TvRemote-play-v0.3.*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvRemote-apk
          path: TvRemote-v0.3.*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ env.TVREMOTE_BUILD_NUMBER }}
          name: TvRemote v0.3.${{ env.TVREMOTE_BUILD_NUMBER }}
          generate_release_notes: true
          files: |
            TvRemote-v0.3.*.apk
            TvRemote-play-v0.3.*.aab
