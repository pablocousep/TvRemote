name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.TVREMOTE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Screenshot tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TvRemote-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          TVREMOTE_KEYSTORE_BASE64: ${{ secrets.TVREMOTE_KEYSTORE_BASE64 }}
          TVREMOTE_KEYSTORE_PASSWORD: ${{ secrets.TVREMOTE_KEYSTORE_PASSWORD }}
          TVREMOTE_KEY_ALIAS: ${{ secrets.TVREMOTE_KEY_ALIAS }}
          TVREMOTE_KEY_PASSWORD: ${{ secrets.TVREMOTE_KEY_PASSWORD }}
        run: |
          echo "$TVREMOTE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvremote.jks"
          export TVREMOTE_KEYSTORE="$RUNNER_TEMP/tvremote.jks"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "TvRemote-v0.3.${{ github.run_number }}.apk"

      - name: Name debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk "TvRemote-v0.3.${{ github.run_number }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvRemote-apk
          path: TvRemote-v0.3.*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: TvRemote v0.3.${{ github.run_number }}
          generate_release_notes: true
          files: TvRemote-v0.3.*.apk
