name: Publish release (one-off)

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TVREMOTE_BUILD_NUMBER: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvRemote-v0.3.50.apk
          gh release create v0.3.50 TvRemote-v0.3.50.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            --title "TvRemote v0.3.50" \
            --notes "$(cat <<'NOTES'
          - Nuevo icono monocromático (tele + mando), compatible con los iconos temáticos de Android 13+.
          - Actualizaciones desde la propia app: avisa cuando hay un release nuevo, lo descarga y lo instala.
          - Todas las versiones se firman con la misma clave, así que las siguientes se instalan encima.
          - Sin chinchetas en los botones de Aplicaciones.

          Importante: para pasar a esta versión desinstala antes la app anterior (tenía otra firma). A partir de aquí ya no hará falta.

          APK de depuración.
          NOTES
          )"
