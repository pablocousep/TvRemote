name: Publish release (one-off)

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TVREMOTE_BUILD_NUMBER: "51"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvRemote-v0.3.51.apk
          gh release create v0.3.51 TvRemote-v0.3.51.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            --title "TvRemote v0.3.51" \
            --notes "$(cat <<'NOTES'
          - Mis televisores: la app guarda las TVs a las que te has conectado, con su último uso.
          - Con Wake-on-LAN o SmartThings configurado, una TV apagada aparece "en reposo" en lugar de dar error de conexión; si la conexión se corta y la TV sigue en la red, se reconecta sola.
          - Botones de apps más fiables: usan el identificador que da la propia TV o los conocidos de cada marca, se abren por la interfaz web de la TV y, si hace falta, por el canal de control con el tipo correcto. Se conecta antes si no lo estaba.

          APK de depuración.
          NOTES
          )"
